syntax = "proto3";

package architect.code.v1;

option csharp_namespace = "Architect.Contracts.Grpc";
option java_multiple_files = true;
option java_package = "com.architect.gateway.grpc";

// Ana AST ve Kod Analiz Servisi (gRPC)
service CodeAnalysisService {
  // Java veya .NET AST Analizi çalıştırma RPC'si
  rpc AnalyzeCodeSnippet (CodeAnalysisRequest) returns (CodeAnalysisResponse);
  
  // Çoklu Ajan Tartışma ve Uzlaşı RPC'si
  rpc ExecuteAgentDebate (AgentDebateRequest) returns (AgentDebateResponse);
  
  // Sistem Sağlık Kontrolü
  rpc CheckHealth (HealthCheckRequest) returns (HealthCheckResponse);
}

// Analiz Edilecek Dil
enum ProgrammingLanguage {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_CSHARP = 1;
  LANGUAGE_JAVA = 2;
}

// Kural İhlal Seviyesi
enum SeverityLevel {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_CRITICAL = 4;
}

// Girdi Talebi
message CodeAnalysisRequest {
  string request_id = 1;
  string repository_url = 2;
  string pull_request_id = 3;
  string file_path = 4;
  string source_code = 5;
  ProgrammingLanguage language = 6;
  bool enable_ai_agents = 7; // true: Ajanlar devreye girsin, false: Sadece deterministik AST
}

// Kod Metrikleri
message CodeMetrics {
  int32 lines_of_code = 1;
  int32 cyclomatic_complexity = 2;
  int32 maintainability_index = 3;
  int32 method_count = 4;
  int32 class_count = 5;
}

// Kural İhlali / Bulgu
message CodeViolation {
  string rule_id = 1;
  string rule_name = 2;
  string description = 3;
  SeverityLevel severity = 4;
  int32 start_line = 5;
  int32 end_line = 6;
  string suggested_fix = 7;
  string category = 8; // CLEAN_ARCHITECTURE, SOLID, SECURITY, CODE_SMELL
}

// AST Analiz Yanıtı (Deterministik Çıktı)
message CodeAnalysisResponse {
  string request_id = 1;
  bool success = 2;
  string error_message = 3;
  CodeMetrics metrics = 4;
  repeated CodeViolation violations = 5;
  int64 execution_time_ms = 6;
}

// Ajan Tartışma Talebi
message AgentDebateRequest {
  string request_id = 1;
  string file_path = 2;
  string source_code = 3;
  ProgrammingLanguage language = 4;
  CodeAnalysisResponse deterministic_findings = 5;
}

// Ajan Bireysel Çıktısı
message AgentOpinion {
  string agent_name = 1; // e.g. "ReviewerAgent", "SecurityAgent", "QaTestWriterAgent"
  string role_title = 2;
  string stance = 3; // "APPROVE", "REQUEST_CHANGES", "NEEDS_SECURITY_FIX"
  string arguments_markdown = 4;
  repeated string proposed_code_patches = 5;
}

// Ajan Tartışması ve Uzlaşı Yanıtı
message AgentDebateResponse {
  string request_id = 1;
  repeated AgentOpinion opinions = 2;
  string final_consensus_summary = 3;
  string generated_unit_test_code = 4; // xUnit or JUnit 5
  string suggested_refactored_code = 5;
  bool requires_human_approval = 6;
}

message HealthCheckRequest {
  string service_name = 1;
}

message HealthCheckResponse {
  string status = 1; // "SERVING", "NOT_SERVING"
  string version = 2;
  int64 timestamp = 3;
}
