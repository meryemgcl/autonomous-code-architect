name: Java 21 & Spring Boot CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/java-gateway-analyzer/**'
      - 'shared/protos/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/java-gateway-analyzer/**'
      - 'shared/protos/**'

jobs:
  build-and-test:
    name: Build & Test Java Spring Boot Gateway
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven & Run JUnit 5 AST Tests
      run: |
        cd services/java-gateway-analyzer
        mvn clean test
